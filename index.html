<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Passionate web developer skilled in HTML, CSS, JavaScript, and React. Enthusiastic about creating user-friendly designs and innovative solutions.">
    <meta name="author" content="Santhosh Saravanan">
    <meta name="keywords" content="HTML, CSS, JavaScript,React,Front-End Development,Responsive Design,Programming,Software Engineering,Problem-Solving,C++,Developer Portfolio,Projects,Portfolio,Personal Website,Work Experience">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Bootstrap Icons for the arrow -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <title>Santhosh Saravanan</title>
    <style>
      /* CSS for the Back to Top Button */
      #back-to-top {
        display: none; /* Hidden by default */
        position: fixed; /* Fixed position */
        bottom: 20px; /* Place at the bottom */
        right: 20px; /* Place at the right */
        z-index: 99; /* Make sure it's on top of other elements */
        padding: 10px 15px; /* Padding for better appearance */
        font-size: 18px; /* Icon size */
        border: none; /* Remove border */
        outline: none; /* Remove outline */
        background-color: #007bff; /* Button background color */
        color: white; /* Icon color */
        cursor: pointer; /* Pointer cursor on hover */
        border-radius: 50%; /* Circular button */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Add shadow */
        transition: background-color 0.3s ease; /* Smooth transition */
      }

      #back-to-top:hover {
        background-color: #0056b3; /* Darker background on hover */
      }

      /* CSS for the WhatsApp Button */
      #whatsapp-button {
        display: block; /* Always visible */
        position: fixed; /* Fixed position */
        bottom: 80px; /* Place above the Back to Top button */
        right: 20px; /* Place at the right */
        z-index: 99; /* Make sure it's on top of other elements */
        padding: 10px 15px; /* Padding for better appearance */
        font-size: 18px; /* Icon size */
        border: none; /* Remove border */
        outline: none; /* Remove outline */
        background-color: #25d366; /* WhatsApp green color */
        color: white; /* Icon color */
        cursor: pointer; /* Pointer cursor on hover */
        border-radius: 50%; /* Circular button */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Add shadow */
        transition: background-color 0.3s ease; /* Smooth transition */
      }

      #whatsapp-button:hover {
        background-color: #128c7e; /* Darker green on hover */
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Your main content goes here -->
      <h1>Welcome to My Portfolio</h1>
      <p>Scroll down to see the "Back to Top" button in action.</p>
      <div style="height: 2000px;">
        <!-- Add enough content to make the page scrollable -->
        <p>Keep scrolling...</p>
      </div>
    </div>

    <!-- Back to Top Button -->
    <button id="back-to-top" title="Go to top">
      <i class="bi bi-arrow-up"></i> <!-- Bootstrap arrow icon -->
    </button>

    <!-- WhatsApp Button -->
    <button id="whatsapp-button" title="Chat on WhatsApp">
      <i class="bi bi-whatsapp"></i> <!-- Bootstrap WhatsApp icon -->
    </button>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Initialize AOS (Animate On Scroll)
      AOS.init();

      // JavaScript for Back to Top Button
      document.addEventListener('DOMContentLoaded', function () {
        // Get the button
        const backToTopButton = document.getElementById('back-to-top');

        // Show the button when the user scrolls down 200px
        window.addEventListener('scroll', function () {
          if (window.scrollY > 200) {
            backToTopButton.style.display = 'block';
          } else {
            backToTopButton.style.display = 'none';
          }
        });

        // Scroll to the top when the button is clicked
        backToTopButton.addEventListener('click', function () {
          window.scrollTo({
            top: 0,
            behavior: 'smooth', // Smooth scroll
          });
        });
      });

      // JavaScript for WhatsApp Button
      document.addEventListener('DOMContentLoaded', function () {
        // Get the WhatsApp button
        const whatsappButton = document.getElementById('whatsapp-button');

        // Add click event to open WhatsApp with a pre-filled message
        whatsappButton.addEventListener('click', function () {
          const phoneNumber = '919025651877'; // Replace with your phone number (with country code)
          const message = 'Hello, I came across your portfolio and would like to connect!'; // Pre-filled message
          const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
          window.open(whatsappUrl, '_blank'); // Open in a new tab
        });
      });
    </script>
  </body>
</html>
